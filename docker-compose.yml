version: '3.8'

services:
  detector:
    build:
      context: ./aegisq
    container_name: aegisq-detector
    command: aegisq pipeline
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - LOG_LEVEL=INFO
    networks:
      - aegisq-net

  api:
    build:
      context: ./aegisq
    container_name: aegisq-api
    command: uvicorn aegisq.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - detector
    networks:
      - aegisq-net

  frontend:
    build:
      context: ./aegisq-miniapp
    container_name: aegisq-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - aegisq-net

networks:
  aegisq-net:
    driver: bridge
